name: VOIDSCAN checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python syntax
        run: python -m py_compile engine.py scan.py server.py storage.py meta_pages.py reaction_collector.py reaction_history.py reaction_assessment.py research_quality.py research_validation.py research_cli.py research_baselines.py reaction_context.py research_replay.py research_readiness.py research_bundle.py research_adjudication.py share_resolver.py secret_store.py manage_token.py launch_voidscan.py token_dialog.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Browser script syntax
        run: node --check web/app.js
      - name: Isolated HTTP smoke
        run: python tests/smoke_http.py
